<!-- ✅ Main Syllabus Content -->
<h2 class="syllabus-title">📘Syllabus Units</h2>
<button (click)="goBack()" class="back-btn">Back</button>

<!-- Syllabus Container -->
<div class="syllabus-container">
  <!-- 📚 Subject List Section (Left) -->
  <div class="subject-list">
    <input
      type="text"
      placeholder="Search subject..."
      [(ngModel)]="searchTerm"
    />
    <ul>
      <li
        *ngFor="let subject of filteredSubjects"
        [class.active]="selectedSubject?.name === subject.name"
        (click)="selectSubject(subject)"
      >
        {{ subject.name }}
      </li>
    </ul>
  </div>

  <!-- 📘 Syllabus Detail Section (Right) -->
  <div class="syllabus-detail" *ngIf="selectedSubject">
    <h2>{{ selectedSubject.name }} Syllabus</h2>

    <div
      *ngFor="let unit of selectedSubject.units; index as i"
      class="unit-box"
    >
      <!-- Unit Header (Toggle) -->
      <div class="unit-header" (click)="toggleUnit(i)">
        {{ unit.split(":")[0] }}
        <span>{{ unitExpanded[i] ? "▲" : "▼" }}</span>
      </div>

      <!-- Unit Body (Conditional) -->
      <div class="unit-body" *ngIf="unitExpanded[i]">
        {{ unit.split(":")[1] }}
      </div>
    </div>
  </div>
</div>

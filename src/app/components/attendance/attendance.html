<div class="attendance-container">
  <h2>📊 Attendance Tracker</h2>

  <label for="subject">Select Subject:</label>
  <select [(ngModel)]="selectedSubject" id="subject">
    <option *ngFor="let subject of subjects" [value]="subject">
      {{ subject }}
    </option>
  </select>

  <div class="actions">
    <button (click)="addClass(selectedSubject)">➕ Add Class</button>
    <button (click)="markPresent(selectedSubject)">✅ Mark Present</button>
  </div>

  <button class="full-day" (click)="markFullDay()">
    📅 Mark Full-Day Attendance
  </button>

  <div class="summary">
    <h3>📈 Summary</h3>
    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Total</th>
          <th>Present</th>
          <th>%</th>
          <th>Need for {{ targetPercentage }}%</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let subject of subjects">
          <td>{{ subject }}</td>
          <td>{{ attendance[subject].total }}</td>
          <td>{{ attendance[subject].present }}</td>
          <td>{{ getPercentage(subject) }}%</td>
          <td>{{ getClassesNeeded(subject) }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
